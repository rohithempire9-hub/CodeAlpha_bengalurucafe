<!DOCTYPE html>
<html>
<head>

<title>My Orders</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">
<link rel="stylesheet" href="/css/zomato.css">

<style>
.order-tracking-map {
  position: relative;
  background: #fff;
  border: 1px solid rgba(0,0,0,.08);
  border-radius: 18px;
  padding: 18px;
  margin-top: 16px;
}
.order-tracking-map::before {
  content: '';
  position: absolute;
  top: 50px;
  left: 48px;
  right: 48px;
  height: 2px;
  background: linear-gradient(90deg, #ff6b27 0%, rgba(255, 107, 39, 0.18) 100%);
}
.order-tracking-point {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.order-tracking-point:last-child {
  margin-bottom: 0;
}
.order-tracking-dot {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #ff6b27;
  box-shadow: 0 0 0 6px rgba(255,107,39,0.14);
}
.order-tracking-pin {
  font-size: 0.95rem;
  line-height: 1.2;
}
.order-tracking-pin strong {
  display: block;
  font-weight: 700;
}
.order-tracking-note {
  padding: 10px 14px;
  background: #fff4e9;
  border: 1px solid rgba(255,107,39,.18);
  border-radius: 12px;
  margin-top: 12px;
  font-size: 0.9rem;
}
</style>

</head>

<body class="bg-light">
<header class="app-header app-header-simple">
  <div class="header-left">
    <a href="/" class="brand">Bengaluru Cafe</a>
  </div>
  <div class="header-right">
    <a href="/orders.html" class="btn-orders">📦 My Orders</a>
    <a href="/cart.html" class="btn-cart">🛒 Cart</a>
    <a href="/login.html" id="loginBtn" class="btn-login">Login</a>
    <a href="/register.html" id="registerBtn" class="btn-register">Register</a>
    <span id="welcomeUser" class="welcome-user"></span>
    <button id="logoutBtn" type="button" class="btn-logout" style="display:none;" onclick="logout();">Logout</button>
  </div>
</header>

<script>
const user = JSON.parse(localStorage.getItem('user'));
if (user) {
  document.getElementById('welcomeUser').innerHTML = `👤 Welcome, ${user.name}`;
  document.getElementById('logoutBtn').style.display = 'inline-flex';
  document.getElementById('loginBtn').style.display = 'none';
  document.getElementById('registerBtn').style.display = 'none';
}
function logout() {
  localStorage.removeItem('user');
  alert('Logged Out Successfully');
  location.reload();
}
</script>

<div class="page-wrapper">
<div class="container mt-5">

<h1 class="page-title">📦 My Orders</h1>

<div id="ordersContainer"></div>

</div>
</div>

<script>

const user = JSON.parse(localStorage.getItem('user')) || null;
const container = document.getElementById('ordersContainer');

if (!user) {
    container.innerHTML = `
<div class="alert alert-info">
Please <a href="/login.html">login</a> to view your order history.
</div>`;
} else {
    fetch(`/api/orders?userId=${user.id}`)
    .then(r=>r.json())
    .then(data=>{
        if (!data.length) {
            container.innerHTML = `
<div class="alert alert-warning">
You have no past orders yet. Start ordering from the menu now.
</div>`;
            return;
        }

        const html = data.map(order => `
<div class="card mb-4 order-card">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-start mb-3 gap-2 flex-wrap">
      <div>
        <h5 class="card-title mb-1">Order ${order.id}</h5>
        <small class="text-muted">${new Date(order.date).toLocaleString()}</small>
      </div>
      <div class="text-end">
        <span class="badge ${getStatusBadgeClass(order.status)}">${order.status}</span>
        <div class="mt-2 small text-secondary">${estimateEta(order.status)}</div>
      </div>
    </div>
    <div class="mb-3">
      <strong>Total:</strong> ₹${order.total}
      <span class="float-end"><strong>Payment:</strong> ${order.payment}</span>
    </div>
    <div class="mb-3">
      <strong>Delivery to:</strong> ${order.address}${order.landmark ? ', ' + order.landmark : ''}
    </div>
    <div class="mb-3">
      <strong>Instructions:</strong> ${order.specialInstructions || 'None'}
    </div>
    <div class="mb-3">
      <strong>Items:</strong>
      <ul class="mb-0">
        ${order.items.map(item => `<li>${item.name} × ${item.quantity} — ₹${item.price * item.quantity}</li>`).join('')}
      </ul>
    </div>
    <div class="mb-3">
      <div class="progress" style="height: 10px;">
        <div class="progress-bar ${getProgressClass(order.status)}" role="progressbar" style="width: ${getProgressValue(order.status)}%;" aria-valuenow="${getProgressValue(order.status)}" aria-valuemin="0" aria-valuemax="100"></div>
      </div>
      <div class="d-flex justify-content-between mt-2 small text-muted">
        <span>Received</span>
        <span>Preparing</span>
        <span>On the way</span>
        <span>Delivered</span>
      </div>
    </div>
    <div class="order-tracking-map">
      <div class="order-tracking-point">
        <span class="order-tracking-dot"></span>
        <div class="order-tracking-pin">
          <strong>Restaurant</strong>
          Bengaluru Cafe kitchen
        </div>
      </div>
      <div class="order-tracking-point">
        <span class="order-tracking-dot"></span>
        <div class="order-tracking-pin">
          <strong>Delivery partner</strong>
          ${order.currentLocation || 'Not available yet'}
        </div>
      </div>
      <div class="order-tracking-point">
        <span class="order-tracking-dot"></span>
        <div class="order-tracking-pin">
          <strong>Destination</strong>
          ${order.address}${order.landmark ? ', ' + order.landmark : ''}
        </div>
      </div>
      <div class="order-tracking-note">
        <strong>${order.locationStatus || 'Tracking pending'}</strong>
        <div>${order.locationUpdatedAt ? `Updated at ${new Date(order.locationUpdatedAt).toLocaleTimeString()}` : 'Your delivery partner will update the live location soon.'}</div>
      </div>
    </div>
  </div>
</div>`).join('');

        container.innerHTML = html;
    })
    .catch(() => {
        container.innerHTML = `
<div class="alert alert-danger">
Unable to load orders. Please refresh the page.
</div>`;
    });
}

function getStatusBadgeClass(status) {
  switch (status) {
    case 'Preparing':
      return 'bg-warning text-dark';
    case 'On the way':
      return 'bg-info text-dark';
    case 'Delivered':
      return 'bg-success';
    case 'Cancelled':
      return 'bg-danger';
    default:
      return 'bg-secondary';
  }
}

function estimateEta(status) {
  if (status === 'Preparing') return '10-15 mins';
  if (status === 'On the way') return '5-10 mins';
  if (status === 'Delivered') return 'Arrived';
  if (status === 'Cancelled') return 'N/A';
  return 'Preparing';
}

function getProgressValue(status) {
  switch (status) {
    case 'Received':
      return 25;
    case 'Preparing':
      return 50;
    case 'On the way':
      return 75;
    case 'Delivered':
      return 100;
    default:
      return 10;
  }
}

function getProgressClass(status) {
  switch (status) {
    case 'Preparing':
      return 'bg-warning';
    case 'On the way':
      return 'bg-info';
    case 'Delivered':
      return 'bg-success';
    case 'Cancelled':
      return 'bg-danger';
    default:
      return 'bg-secondary';
  }
}

</script>

</body>
</html>
