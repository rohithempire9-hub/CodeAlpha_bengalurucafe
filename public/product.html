<!DOCTYPE html>
<html>
<head>
<title>Product Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#f5f5f5;
font-family:'Segoe UI';
}

.product-box{
max-width:900px;
margin:auto;
margin-top:50px;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.price{
font-size:28px;
font-weight:bold;
color:green;
}
</style>

</head>
<body>

<div class="product-box">

<h1 id="name"></h1>

<p id="category"></p>

<h3 class="price" id="price"></h3>

<p>
Authentic Bengaluru Cafe special dish prepared fresh every day.
</p>

<button
id="addBtn"
class="btn btn-warning">
Add To Cart
</button>

</div>

<script>

const params =
new URLSearchParams(window.location.search);

const id = params.get('id');

fetch('/api/menu')
.then(r=>r.json())
.then(menu=>{

const item =
menu.find(p=>p.id == id);

document.getElementById('name').innerText =
item.name;

document.getElementById('category').innerText =
item.category;

document.getElementById('price').innerText =
'₹' + item.price;

document.getElementById('addBtn')
.onclick = function(){

let cart =
JSON.parse(localStorage.getItem('cart'))
|| [];

let existing =
cart.find(i=>i.id==item.id);

if(existing){
existing.quantity++;
}
else{
cart.push({
id:item.id,
name:item.name,
price:item.price,
quantity:1
});
}

localStorage.setItem(
'cart',
JSON.stringify(cart)
);

alert('Added To Cart');

};

});

</script>

</body>
</html>
