<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f5f5f5;
font-family:'Segoe UI';
}

.dashboard{
max-width:1200px;
margin:auto;
padding:30px;
}

.card{
border:none;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
}

</style>

</head>
<body>

<div class="dashboard">

<h1 class="mb-4">
📋 Bengaluru Cafe Admin Dashboard
</h1>

<!-- Statistics -->

<div class="row mb-4">

<div class="col-md-4">
<div class="card p-3 text-center">
<h2 id="totalOrders">0</h2>
<p>Total Orders</p>
</div>
</div>

<div class="col-md-4">
<div class="card p-3 text-center">
<h2 id="totalUsers">0</h2>
<p>Registered Users</p>
</div>
</div>

<div class="col-md-4">
<div class="card p-3 text-center">
<h2 id="totalProducts">0</h2>
<p>Menu Items</p>
</div>
</div>

</div>

<!-- Orders -->

<h2>Orders</h2>

<table class="table table-striped table-bordered">

<thead>
<tr>
<th>ID</th>
<th>Customer</th>
<th>Phone</th>
<th>Payment</th>
<th>Total</th>
<th>Date</th>
</tr>
</thead>

<tbody id="ordersTable"></tbody>

</table>

<!-- Users -->

<h2 class="mt-5">
Registered Users
</h2>

<table class="table table-bordered">

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
</tr>
</thead>

<tbody id="usersTable"></tbody>

</table>

<!-- Menu -->

<h2 class="mt-5">
Menu Items
</h2>

<table class="table table-striped">

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Price</th>
<th>Category</th>
</tr>
</thead>

<tbody id="menuTable"></tbody>

</table>

</div>

<h2 class="mt-5">
Menu Management
</h2>

<div class="card p-3 mb-3">
<h5 id="formTitle">Add New Item</h5>
<input type="hidden" id="editId">
<div class="row g-2">
<div class="col-md-3">
<input class="form-control" id="itemName" placeholder="Name">
</div>
<div class="col-md-2">
<input class="form-control" id="itemPrice" type="number" placeholder="Price">
</div>
<div class="col-md-2">
<select class="form-control" id="itemCategory">
<option value="idli">Idli</option>
<option value="dosa">Dosa</option>
<option value="special">Special</option>
<option value="sweet">Sweet</option>
<option value="pesarattu">Pesarattu</option>
</select>
</div>
<div class="col-md-3">
<input class="form-control" id="itemImage" placeholder="Image URL (optional)">
</div>
<div class="col-md-2">
<button class="btn btn-success w-100" onclick="saveMenuItem()" id="saveBtn">Add</button>
</div>
</div>
</div>

<table class="table table-bordered">

<thead>
<tr>
<th>Image</th>
<th>Name</th>
<th>Price</th>
<th>Category</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="menuTable"></tbody>

</table>

</div>

<script>

// ORDERS

fetch('/api/orders')
.then(r=>r.json())
.then(data=>{

let html='';

data.forEach(order=>{

html += `
<tr>
<td>${order.id}</td>
<td>${order.customerName}</td>
<td>${order.phone}</td>
<td>${order.payment}</td>
<td>₹${order.total}</td>
<td>${new Date(order.date).toLocaleString()}</td>
</tr>
`;

});

document.getElementById('ordersTable').innerHTML = html;

document.getElementById('totalOrders').innerText =
data.length;

});


// USERS

fetch('/api/users')
.then(r=>r.json())
.then(users=>{

let html='';

users.forEach(user=>{

html += `
<tr>
<td>${user.id}</td>
<td>${user.name}</td>
<td>${user.email}</td>
</tr>
`;

});

document.getElementById('usersTable').innerHTML =
html;

document.getElementById('totalUsers').innerText =
users.length;

});


// MENU

function loadMenu(){
fetch('/api/menu')
.then(r=>r.json())
.then(menu=>{

let html='';

menu.forEach(item=>{

html += `
<tr>
<td><img src="${item.image}" style="width:60px;height:60px;object-fit:cover;border-radius:8px;"></td>
<td>${item.name}</td>
<td>₹${item.price}</td>
<td>${item.category}</td>
<td>
<button class="btn btn-sm btn-primary me-1" onclick="editMenuItem('${item.id}','${item.name.replace(/'/g, "\\'")}',${item.price},'${item.category}','${item.image}')">Edit</button>
<button class="btn btn-sm btn-danger" onclick="deleteMenuItem('${item.id}')">Delete</button>
</td>
</tr>
`;

});

document.getElementById('menuTable').innerHTML = html;

document.getElementById('totalProducts').innerText =
menu.length;

});
}

loadMenu();

function resetMenuForm(){
document.getElementById('editId').value = '';
document.getElementById('itemName').value = '';
document.getElementById('itemPrice').value = '';
document.getElementById('itemImage').value = '';
document.getElementById('itemCategory').value = 'idli';
document.getElementById('formTitle').innerText = 'Add New Item';
document.getElementById('saveBtn').innerText = 'Add';
}

function editMenuItem(id, name, price, category, image){
document.getElementById('editId').value = id;
document.getElementById('itemName').value = name;
document.getElementById('itemPrice').value = price;
document.getElementById('itemCategory').value = category;
document.getElementById('itemImage').value = image;
document.getElementById('formTitle').innerText = 'Edit Item';
document.getElementById('saveBtn').innerText = 'Update';
}

function saveMenuItem(){

const id = document.getElementById('editId').value;
const name = document.getElementById('itemName').value.trim();
const price = parseFloat(document.getElementById('itemPrice').value);
const category = document.getElementById('itemCategory').value;
const image = document.getElementById('itemImage').value.trim();

if(!name || !price){
alert('Please enter a name and price');
return;
}

const payload = { name, price, category, image };

const url = id ? `/api/menu/${id}` : '/api/menu';
const method = id ? 'PUT' : 'POST';

fetch(url, {
method,
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(payload)
})
.then(r => r.json())
.then(data => {
if(data.success){
resetMenuForm();
loadMenu();
} else {
alert(data.message || 'Something went wrong');
}
});
}

function deleteMenuItem(id){

if(!confirm('Delete this item?')) return;

fetch(`/api/menu/${id}`, { method: 'DELETE' })
.then(r => r.json())
.then(data => {
if(data.success){
loadMenu();
} else {
alert(data.message || 'Could not delete item');
}
});
}
</script>

</body>
</html>
