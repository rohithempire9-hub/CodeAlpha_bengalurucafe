<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bengaluru Cafe</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f8f8f8;
    font-family:'Segoe UI',sans-serif;
}

.hero{
    height:80vh;
    background:
    linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
    url('https://images.unsplash.com/photo-1630383249896-424e482df921?q=80&w=1600');
    background-size:cover;
    background-position:center;
    color:white;
    display:flex;
    align-items:center;
}

.card{
    transition:.3s;
    border:none;
    border-radius:15px;
    overflow:hidden;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    height:220px;
    object-fit:cover;
}

.price{
    color:#198754;
    font-size:22px;
    font-weight:bold;
}

.navbar{
    background:#0b3d0b;
}

.navbar-brand{
    color:white!important;
    font-weight:bold;
}

.menu-title{
    text-align:center;
    margin:60px 0 30px;
}

.btn-order{
    background:#ff9800;
    color:white;
    border:none;
}

.btn-order:hover{
    background:#e68900;
    color:white;
}

footer{
    background:#0b3d0b;
    color:white;
    padding:20px;
    margin-top:50px;
}

</style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
<div class="container">

<a class="navbar-brand" href="#">
🍽 Bengaluru Cafe
</a>

<div>
<a href="/login.html"
id="loginBtn"
class="btn btn-outline-light me-2">
Login
</a>

<a href="/register.html"
id="registerBtn"
class="btn btn-light me-2">
Register
</a>
<span
id="welcomeUser"
class="text-white me-2">
</span>

<button
id="logoutBtn"
class="btn btn-danger"
style="display:none;"
onclick="logout()">
Logout
</button>

<a href="/cart.html"
class="btn btn-warning">
🛒 Cart
<span id="cartCount"
class="badge bg-dark">0</span>
</a>
<a href="/orders.html"
class="btn btn-info">
📦 My Orders
</a>
</div>

</div>
</nav>

<section class="hero">
<div class="container">
<h1 class="display-2 fw-bold">
BENGALURU CAFE
</h1>

<p class="lead">
Authentic South Indian Food Made With Tradition
</p>

<a href="#menu" class="btn btn-warning btn-lg">
Order Now
</a>
</div>
</section>
<div class="container mt-4">

<input
type="text"
id="searchBox"
class="form-control"
placeholder="🔍 Search dishes..."
onkeyup="searchMenu()">

</div>

<div class="container" id="menu">
<div class="text-center mb-4">

<button class="btn btn-success m-1"
onclick="filterMenu('all')">
All
</button>

<button class="btn btn-success m-1"
onclick="filterMenu('idli')">
Idli
</button>

<button class="btn btn-success m-1"
onclick="filterMenu('dosa')">
Dosa
</button>

<button class="btn btn-success m-1"
onclick="filterMenu('special')">
Specials
</button>

<button class="btn btn-success m-1"
onclick="filterMenu('sweet')">
Sweets
</button>

</div>
<h2 class="menu-title">
Our Popular Menu
</h2>

<div class="row g-4" id="menuItems">
<!-- Menu cards are loaded dynamically from /api/menu -->
</div>

</div>

<footer class="text-center">
<h5>Bengaluru Cafe</h5>
<p>Authentic Karnataka & South Indian Flavours</p>
</footer>

<script>

let cart = JSON.parse(localStorage.getItem('cart')) || [];

function renderMenuCard(item) {
    return `
<div class="col-md-3 menu-item ${item.category}">
<div class="card shadow">

<img src="${item.image}" class="card-img-top">

<div class="card-body">

<h5>
<a href="/product.html?id=${item.id}">
${item.name}
</a>
</h5>

<p class="price">₹${item.price}</p>

<button
class="btn btn-order w-100"
onclick="addToCart('${item.id}','${item.name.replace(/'/g, "\\'")}',${item.price})">
Add To Cart
</button>

</div>
</div>
</div>`;
}

fetch('/api/menu')
.then(r => r.json())
.then(menu => {
    document.getElementById('menuItems').innerHTML =
        menu.map(renderMenuCard).join('');
});

function addToCart(id,name,price){

let existingItem = cart.find(item => item.id === id);

if(existingItem){
    existingItem.quantity += 1;
}
else{
    cart.push({
        id:id,
        name:name,
        price:price,
        quantity:1
    });
}

localStorage.setItem('cart',JSON.stringify(cart));

updateCartCount();

alert(name + " added to cart!");

}
function searchMenu() {

    let input = document
        .getElementById('searchBox')
        .value
        .toLowerCase()
        .trim();

    let cards = document.querySelectorAll('.menu-item');

    cards.forEach(card => {

        let title = card
            .querySelector('h5')
            .textContent
            .toLowerCase();

        if (title.includes(input)) {
            card.style.display = "";
        } else {
            card.style.display = "none";
        }
    });
}
    function filterMenu(category){

let items =
document.querySelectorAll('.menu-item');

items.forEach(item => {

if(
category === 'all' ||
item.classList.contains(category)
){
item.style.display = '';
}
else{
item.style.display = 'none';
}

});

}
updateCartCount();

function updateCartCount(){

let cart =
JSON.parse(localStorage.getItem('cart'))
|| [];

let count = 0;

cart.forEach(item=>{

count += item.quantity;

});

document.getElementById('cartCount')
.innerText = count;

}
const user =
JSON.parse(localStorage.getItem('user'));

if(user){

document.getElementById('welcomeUser')
.innerHTML =
`👤 Welcome, ${user.name}`;

document.getElementById('logoutBtn')
.style.display = 'inline-block';

document.getElementById('loginBtn')
.style.display = 'none';

document.getElementById('registerBtn')
.style.display = 'none';

}

function logout(){

localStorage.removeItem('user');

alert('Logged Out Successfully');

location.reload();

}
</script>
</body>
</html>
