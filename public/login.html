<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Bengaluru Cafe</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f5f5f5;
    font-family:'Segoe UI',sans-serif;
}

.login-box{
    max-width:450px;
    margin:auto;
    margin-top:80px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.navbar{
    background:#0b3d0b;
}

</style>

</head>
<body>

<nav class="navbar navbar-dark">
<div class="container">
<a href="/CodeAlpha_bengalurucafe//" class="navbar-brand">
🍽 Bengaluru Cafe
</a>
</div>
</nav>

<div class="login-box">

<h2 class="text-center mb-4">
Login
</h2>

<form id="loginForm">

<div class="mb-3">
<label>Email</label>
<input
type="email"
id="email"
class="form-control"
required>
</div>

<div class="mb-3">
<label>Password</label>
<input
type="password"
id="password"
class="form-control"
required>
</div>

<button
type="submit"
class="btn btn-success w-100">
Login
</button>

</form>

<div class="text-center mt-3">

<p>
Don't have an account?
<a href="/CodeAlpha_bengalurucafe//register.html">
Register Here
</a>
</p>

</div>

</div>

<script>

document
.getElementById('loginForm')
.addEventListener('submit', async function(e){

e.preventDefault();

const email =
document.getElementById('email').value;

const password =
document.getElementById('password').value;

const response = await fetch('/api/login',{

method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({
email,
password
})

});

const data = await response.json();

if(data.success){

localStorage.setItem(
'user',
JSON.stringify(data.user)
);

alert('Login Successful!');

window.location.href='/';

}
else{

alert(data.message);

}

});

</script>

</body>
</html>
