<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Register - Bengaluru Cafe</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/zomato.css">
</head>
<body class="bg-light">
<header class="app-header app-header-simple">
  <div class="header-left">
    <a href="/" class="brand">Bengaluru Cafe</a>
  </div>
  <div class="header-right">
    <a href="/orders.html" class="btn-orders">📦 My Orders</a>
    <a href="/cart.html" class="btn-cart">🛒 Cart</a>
    <a href="/login.html" class="btn-login">Login</a>
  </div>
</header>

<div class="page-wrapper">
<div class="container mt-5">
<div class="row justify-content-center">
<div class="col-md-5">

<div class="card shadow p-4">

<h2 class="text-center mb-4">
🍽 Register
</h2>

<form id="registerForm">

<input class="form-control mb-3"
id="name"
placeholder="Full Name">

<input class="form-control mb-3"
id="email"
type="email"
placeholder="Email">

<input class="form-control mb-3"
id="password"
type="password"
placeholder="Password">

<button class="btn btn-success w-100">
Register
</button>

</form>

</div>
</div>
</div>
</div>

<script>
document.getElementById('registerForm')
.addEventListener('submit', async function(e){

e.preventDefault();

const response = await fetch('/api/register',{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify({
name:document.getElementById('name').value,
email:document.getElementById('email').value,
password:document.getElementById('password').value
})
});

const data = await response.json();

alert(data.message);

if(data.success){
window.location.href='/login.html';
}

});
</script>

</body>
</html>
