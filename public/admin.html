<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f5f5f5;
font-family:'Segoe UI';
}

.dashboard{
max-width:1200px;
margin:auto;
padding:30px;
}

.card{
border:none;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
}

</style>

</head>
<body>

<div class="dashboard">

<h1 class="mb-4">
📋 Bengaluru Cafe Admin Dashboard
</h1>

<!-- Statistics -->

<div class="row mb-4">

<div class="col-md-4">
<div class="card p-3 text-center">
<h2 id="totalOrders">0</h2>
<p>Total Orders</p>
</div>
</div>

<div class="col-md-4">
<div class="card p-3 text-center">
<h2 id="totalUsers">0</h2>
<p>Registered Users</p>
</div>
</div>

<div class="col-md-4">
<div class="card p-3 text-center">
<h2 id="totalProducts">0</h2>
<p>Menu Items</p>
</div>
</div>

</div>

<!-- Orders -->

<h2>Orders</h2>

<table class="table table-striped table-bordered">

<thead>
<tr>
<th>ID</th>
<th>Customer</th>
<th>Phone</th>
<th>Payment</th>
<th>Total</th>
<th>Date</th>
</tr>
</thead>

<tbody id="ordersTable"></tbody>

</table>

<!-- Users -->

<h2 class="mt-5">
Registered Users
</h2>

<table class="table table-bordered">

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
</tr>
</thead>

<tbody id="usersTable"></tbody>

</table>

<!-- Menu -->

<h2 class="mt-5">
Menu Items
</h2>

<table class="table table-striped">

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Price</th>
<th>Category</th>
</tr>
</thead>

<tbody id="menuTable"></tbody>

</table>

</div>

<script>

// ORDERS

fetch('/api/orders')
.then(r=>r.json())
.then(data=>{

let html='';

data.forEach(order=>{

html += `
<tr>
<td>${order.id}</td>
<td>${order.customerName}</td>
<td>${order.phone}</td>
<td>${order.payment}</td>
<td>₹${order.total}</td>
<td>${new Date(order.date).toLocaleString()}</td>
</tr>
`;

});

document.getElementById('ordersTable').innerHTML = html;

document.getElementById('totalOrders').innerText =
data.length;

});


// USERS

fetch('/api/users')
.then(r=>r.json())
.then(users=>{

let html='';

users.forEach(user=>{

html += `
<tr>
<td>${user.id}</td>
<td>${user.name}</td>
<td>${user.email}</td>
</tr>
`;

});

document.getElementById('usersTable').innerHTML =
html;

document.getElementById('totalUsers').innerText =
users.length;

});


// MENU

fetch('/api/menu')
.then(r=>r.json())
.then(menu=>{

let html='';

menu.forEach(item=>{

html += `
<tr>
<td>${item.id}</td>
<td>${item.name}</td>
<td>₹${item.price}</td>
<td>${item.category}</td>
</tr>
`;

});

document.getElementById('menuTable').innerHTML =
html;

document.getElementById('totalProducts').innerText =
menu.length;

});
</script>

</body>
</html>
