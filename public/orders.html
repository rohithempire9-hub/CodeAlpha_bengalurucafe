<!DOCTYPE html>
<html>
<head>

<title>My Orders</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h1>📦 My Orders</h1>

<table class="table table-bordered mt-4">

<thead>

<tr>
<th>ID</th>
<th>Total</th>
<th>Payment</th>
<th>Date</th>
</tr>

</thead>

<tbody id="ordersTable"></tbody>

</table>

</div>

<script>

fetch('/api/orders')
.then(r=>r.json())
.then(data=>{

let html='';

data.forEach(order=>{

html+=`
<tr>

<td>${order.id}</td>

<td>₹${order.total}</td>

<td>${order.payment}</td>

<td>
${new Date(order.date)
.toLocaleString()}
</td>

</tr>
`;

});

document.getElementById('ordersTable')
.innerHTML=html;

});

</script>

</body>
</html>
