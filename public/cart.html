<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart - Bengaluru Cafe</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/zomato.css">

<style>

body{
    background:#f5f5f5;
    font-family:'Segoe UI',sans-serif;
}

.navbar{
    background:#0b3d0b;
}

.qty-btn{
    width:40px;
}

.checkout-btn{
    width:100%;
}

</style>
</head>

<body>
<header class="app-header app-header-simple">
  <div class="header-left">
    <a href="/" class="brand">Bengaluru Cafe</a>
  </div>
  <div class="header-right">
    <a href="/orders.html" class="btn-orders">📦 My Orders</a>
    <a href="/cart.html" class="btn-cart">🛒 Cart</a>
    <a href="/login.html" class="btn-login">Login</a>
  </div>
</header>

<div class="page-wrapper">
  <div class="container cart-container">

    <h1 class="page-title">
      🛒 Your Cart
    </h1>

<div id="cartItems"></div>

<div class="total-box">

<h3 id="grandTotal">
Total: ₹0
</h3>

<button class="btn btn-success checkout-btn mt-3"
onclick="checkout()">
Proceed To Checkout
</button>

</div>

</div>

<script>

let cart = JSON.parse(localStorage.getItem('cart')) || [];

function renderCart(){

let container = document.getElementById('cartItems');

if(cart.length === 0){

container.innerHTML = `
<div class="alert alert-warning">
Your cart is empty.
</div>
`;

document.getElementById('grandTotal').innerHTML =
"Total: ₹0";

return;
}

let html = '';
let total = 0;

cart.forEach((item,index)=>{

let itemTotal = item.price * item.quantity;

total += itemTotal;

html += `

<div class="cart-card">

<div class="row align-items-center">

<div class="col-md-4">
<h4>${item.name}</h4>
</div>

<div class="col-md-2">
₹${item.price}
</div>

<div class="col-md-3">

<button
class="btn btn-danger qty-btn"
onclick="decreaseQty(${index})">
-
</button>

<span class="mx-3">
${item.quantity}
</span>

<button
class="btn btn-success qty-btn"
onclick="increaseQty(${index})">
+
</button>

</div>

<div class="col-md-2">

<strong>
₹${itemTotal}
</strong>

</div>

<div class="col-md-1">

<button
class="btn btn-dark"
onclick="removeItem(${index})">
🗑
</button>

</div>

</div>

</div>

`;

});

container.innerHTML = html;

document.getElementById('grandTotal').innerHTML =
`Total: ₹${total}`;

}

function increaseQty(index){

cart[index].quantity++;

saveCart();

}

function decreaseQty(index){

if(cart[index].quantity > 1){
cart[index].quantity--;
}
else{
cart.splice(index,1);
}

saveCart();

}

function removeItem(index){

cart.splice(index,1);

saveCart();

}

function saveCart(){

localStorage.setItem(
'cart',
JSON.stringify(cart)
);

renderCart();

}
function checkout(){

window.location.href =
'/checkout.html';

}

renderCart();

</script>

</body>
</html>
