<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout - Bengaluru Cafe</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/zomato.css">

<style>

body{
    background:#f5f5f5;
    font-family:'Segoe UI',sans-serif;
}

.navbar{
    background:#0b3d0b;
}

.order-summary{
    background:#f8f8f8;
    padding:20px;
    border-radius:10px;
}

</style>

</head>
<body>
<header class="app-header app-header-simple">
  <div class="header-left">
    <a href="/" class="brand">Bengaluru Cafe</a>
  </div>
  <div class="header-right">
    <a href="/orders.html" class="btn-orders">📦 My Orders</a>
    <a href="/cart.html" class="btn-cart">🛒 Cart</a>
    <a href="/login.html" id="loginBtn" class="btn-login">Login</a>
    <a href="/register.html" id="registerBtn" class="btn-register">Register</a>
    <span id="welcomeUser" class="welcome-user"></span>
    <button id="logoutBtn" type="button" class="btn-logout" style="display:none;" onclick="logout();">Logout</button>
  </div>
</header>

<script>
const headerUser = JSON.parse(localStorage.getItem('user'));
if (headerUser) {
  document.getElementById('welcomeUser').innerHTML = `👤 Welcome, ${headerUser.name}`;
  document.getElementById('logoutBtn').style.display = 'inline-flex';
  document.getElementById('loginBtn').style.display = 'none';
  document.getElementById('registerBtn').style.display = 'none';
}
function logout() {
  localStorage.removeItem('user');
  alert('Logged Out Successfully');
  location.reload();
}
</script>

<div class="page-wrapper">
  <div class="checkout-box">

    <h1 class="page-title">
      Checkout
    </h1>

<div class="row">

<div class="col-md-6">

<div class="mb-3">
<label class="form-label">Customer Name</label>
<input type="text" id="customerName" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Phone Number</label>
<input type="text" id="phone" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" id="email" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Delivery Address</label>
<input type="text" id="address" class="form-control" placeholder="House number, street, area">
</div>

<div class="mb-3">
<label class="form-label">Landmark / Locality</label>
<input type="text" id="landmark" class="form-control" placeholder="Near park, building name, etc.">
</div>

<div class="mb-3">
<label class="form-label">Special Instructions</label>
<textarea id="instructions" class="form-control" placeholder="Add delivery notes or food preferences"></textarea>
</div>

<div class="mb-3">
<label class="form-label">Payment Method</label>
<select id="payment" class="form-select">
<option>Cash on Delivery</option>
<option>UPI</option>
<option>Card</option>
</select>
</div>

</div>

<div class="col-md-6">

<div class="order-summary">

<h4>Order Summary</h4>

<div id="summary"></div>

<hr>

<h5 id="totalAmount">
Total: ₹0
</h5>

</div>

</div>

</div>

<button
class="btn btn-success mt-4 w-100"
onclick="placeOrder()">
Place Order
</button>

</div>
</div>

<script>

let cart = JSON.parse(localStorage.getItem('cart')) || [];
const checkoutUser = JSON.parse(localStorage.getItem('user')) || {};

if (checkoutUser.name) {
    document.getElementById('customerName').value = checkoutUser.name;
}
if (checkoutUser.email) {
    document.getElementById('email').value = checkoutUser.email;
}

let total = 0;
let html = '';

if (cart.length === 0) {
    document.getElementById('summary').innerHTML = `
<div class="alert alert-warning">
Your cart is empty. Add items to checkout.
</div>`;
    document.getElementById('totalAmount').innerText = 'Total: ₹0';
} else {
    cart.forEach(item=>{
        let itemTotal = item.price * item.quantity;
        total += itemTotal;
        html += `
<div class="mb-2">
<strong>${item.name}</strong> × ${item.quantity}
<span class="float-end">₹${itemTotal}</span>
</div>`;
    });
    document.getElementById('summary').innerHTML = html;
    document.getElementById('totalAmount').innerText = `Total: ₹${total}`;
}

function placeOrder(){
    if (cart.length === 0) {
        alert('Your cart is empty. Add items before placing an order.');
        return;
    }

    let customerName = document.getElementById('customerName').value.trim();
    let email = document.getElementById('email').value.trim();
    let phone = document.getElementById('phone').value.trim();
    let address = document.getElementById('address').value.trim();
    let landmark = document.getElementById('landmark').value.trim();
    let instructions = document.getElementById('instructions').value.trim();
    let payment = document.getElementById('payment').value;

    if (!customerName || !email || !phone || !address || !payment) {
        alert('Please fill in your name, email, phone, address, and payment method.');
        return;
    }

    fetch('/api/order', {
        method:'POST',
        headers:{
            'Content-Type':'application/json'
        },
        body:JSON.stringify({
            userId: checkoutUser.id || '',
            userEmail: email,
            customerName,
            phone,
            address,
            landmark,
            payment,
            items: cart,
            total,
            specialInstructions: instructions
        })
    })
    .then(r=>r.json())
    .then(data=>{
        if (!data.success) {
            alert(data.message || 'Could not place order. Please try again.');
            return;
        }

        alert('Order placed successfully!');
        localStorage.removeItem('cart');
        window.location.href='/orders.html';
    })
    .catch(() => {
        alert('Unable to place order at this time. Please try again later.');
    });
}

</script>

</body>
</html>
